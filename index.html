<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title> Clock</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --bg: #000;
  --card: #111;
  --card-dark: #0a0a0a;
  --digit: #f2f2f2;
  --accent: rgba(255,255,255,0.3);

  --size: 260px;
  --radius: 28px;
  --digit-size: 9.8rem;

  --flip-duration: 600ms;
  --ease: cubic-bezier(.4,.0,.2,1);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: radial-gradient(circle, #111, #000);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: system-ui, sans-serif;
}

.clock {
  display: flex;
  gap: 12px;
}

.card {
  width: var(--size);
  height: var(--size);
  background: linear-gradient(#141414, #0a0a0a);
  border-radius: var(--radius);
  box-shadow: 0 40px 80px rgba(0,0,0,.9);
  position: relative;
  perspective: 1200px;
  overflow: hidden;
}

/* seam */
.card::after {
  content: "";
  position: absolute;
  left: 12%;
  right: 12%;
  top: 50%;
  height: 1px;
  background: rgba(255,255,255,.05);
  z-index: 5;
}

/* ================= FLIP DIGIT ================= */

.flip {
  position: absolute;
  inset: 0;
}

.half {
  position: absolute;
  width: 100%;
  height: 50%;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: var(--digit-size);
  font-weight: 700;
  color: var(--digit);
  backface-visibility: hidden;
}

.half.top {
  top: 0;
}

.half.bottom {
  bottom: 0;
}

.half span {
  transform: translateY(50%);
}

.half.bottom span {
  transform: translateY(-50%);
}

/* animated flap */
.flap {
  position: absolute;
  width: 100%;
  height: 50%;
  top: 0;
  background: linear-gradient(#151515, #0d0d0d);
  border-radius: var(--radius) var(--radius) 0 0;
  transform-origin: bottom;
  transform: rotateX(0deg);
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: var(--digit-size);
  font-weight: 700;
  color: var(--digit);
  backface-visibility: hidden;
}

.flap.animate {
  animation: flipDown var(--flip-duration) var(--ease) forwards;
}

@keyframes flipDown {
  0%   { transform: rotateX(0deg); }
  100% { transform: rotateX(-90deg); }
}

/* ================= ACCENTS ================= */

.ampm {
  position: absolute;
  top: 14px;
  left: 18px;
  font-size: .85rem;
  letter-spacing: .12em;
  color: var(--accent);
}

.seconds {
  position: absolute;
  bottom: 14px;
  right: 18px;
  font-size: .85rem;
  letter-spacing: .12em;
  color: var(--accent);
}
</style>
</head>

<body>

<div class="clock">
  <div class="card">
    <div class="ampm" id="ampm">AM</div>
    <div class="flip" id="hour"></div>
  </div>
  <div class="card">
    <div class="seconds" id="sec">00</div>
    <div class="flip" id="minute"></div>
  </div>
</div>

<script>
function createFlip(container, value) {
  container.innerHTML = `
    <div class="half top"><span>${value}</span></div>
    <div class="half bottom"><span>${value}</span></div>
    <div class="flap"><span>${value}</span></div>
  `;
}

function flip(container, newValue) {
  const top = container.querySelector('.half.top span');
  const bottom = container.querySelector('.half.bottom span');
  const flap = container.querySelector('.flap span');
  const flapEl = container.querySelector('.flap');

  if (top.textContent === newValue) return;

  flap.textContent = top.textContent;
  flapEl.classList.remove('animate');
  void flapEl.offsetWidth;
  flapEl.classList.add('animate');

  setTimeout(() => {
    top.textContent = newValue;
    bottom.textContent = newValue;
    flapEl.classList.remove('animate');
  }, 600);
}

function getTime() {
  const d = new Date();
  let h = d.getHours();
  const m = d.getMinutes();
  const s = d.getSeconds();
  const ampm = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;
  return { h, m, s, ampm };
}

const hourEl = document.getElementById("hour");
const minEl = document.getElementById("minute");
const secEl = document.getElementById("sec");
const ampmEl = document.getElementById("ampm");

let lastH = null;
let lastM = null;

function tick() {
  const { h, m, s, ampm } = getTime();

  if (lastH === null) {
    createFlip(hourEl, h);
    createFlip(minEl, String(m).padStart(2,"0"));
    lastH = h;
    lastM = m;
  } else {
    if (h !== lastH) {
      flip(hourEl, h);
      lastH = h;
    }
    if (m !== lastM) {
      flip(minEl, String(m).padStart(2,"0"));
      lastM = m;
    }
  }

  ampmEl.textContent = ampm;
  secEl.textContent = String(s).padStart(2,"0");

  setTimeout(tick, 1000);
}

tick();
</script>

</body>
</html>
