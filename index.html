<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">

<meta charset="UTF-8" />
<title>Clock</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
/* ===== RESET ===== */
* { box-sizing: border-box; }
html, body {
  margin: 0;
  height: 100%;
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* ===== LAYOUT ===== */
.clock {
  display: flex;
  gap: 8px;
}

/* ===== CARD (DESKTOP FIXED) ===== */
.card {
  width: 260px;
  height: 260px;
  position: relative;
  background: linear-gradient(to bottom, #0b0b0b, #060606);
  border-radius: 22px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.015),
    0 28px 70px rgba(0,0,0,0.9);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

.card::after {
  content: "";
  position: absolute;
  left: 18%;
  right: 18%;
  top: 50%;
  height: 1px;
  background: rgba(255,255,255,0.025);
}

/* ===== DIGITS ===== */
.digit-wrapper {
  position: relative;
  width: 100%;
  height: 100%;
}

.digit {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 150px;
  font-weight: 700;
  color: #f5f5f5;
  line-height: 1;
  opacity: 1;
  transition: opacity 110ms linear;
}

.digit.enter { opacity: 0; }
.digit.exit  { opacity: 0; }

/* ===== ACCENTS ===== */
.ampm {
  position: absolute;
  top: 16px;
  left: 20px;
  font-size: 14px;
  letter-spacing: 0.12em;
  font-weight: 600;
  color: rgba(255,255,255,0.22);
}

.seconds {
  position: absolute;
  bottom: 16px;
  right: 20px;
  font-size: 14px;
  letter-spacing: 0.12em;
  font-weight: 600;
  color: rgba(255,255,255,0.22);
  opacity: 0.24;
  will-change: opacity;
}

/* ===== MOBILE OPTIMIZATION ===== */
@media (max-width: 640px) {
  body {
    align-items: flex-start;
  }

  .clock {
    gap: 6px;
    margin-top: 24px;
  }

  .card {
    width: 180px;
    height: 180px;
    border-radius: 18px;
  }

  .digit {
    font-size: 105px;
  }

  .ampm,
  .seconds {
    font-size: 12px;
    top: 12px;
    left: 14px;
    right: 14px;
    bottom: 12px;
  }
}
</style>
</head>

<body>

<div class="clock">

  <div class="card">
    <div class="ampm" id="ampm">AM</div>
    <div class="digit-wrapper" id="hour"></div>
  </div>

  <div class="card">
    <div class="seconds" id="seconds">00</div>
    <div class="digit-wrapper" id="minute"></div>
  </div>

</div>

<script>
function getTimeParts() {
  const d = new Date();
  let h = d.getHours();
  const m = d.getMinutes();
  const s = d.getSeconds();
  const ampm = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;
  return { h, m, s, ampm };
}

function updateDigit(container, value) {
  const cur = container.querySelector(".digit");
  if (cur && cur.textContent === value) return;

  const next = document.createElement("div");
  next.className = "digit enter";
  next.textContent = value;
  container.appendChild(next);

  requestAnimationFrame(() => {
    next.classList.remove("enter");
    if (cur) cur.classList.add("exit");
  });

  if (cur) setTimeout(() => cur.remove(), 140);
}

const hourEl = document.getElementById("hour");
const minuteEl = document.getElementById("minute");
const ampmEl = document.getElementById("ampm");
const secEl = document.getElementById("seconds");

let lastH = null;
let lastM = null;

function tick() {
  const { h, m, s, ampm } = getTimeParts();

  if (lastH === null) {
    hourEl.innerHTML = `<div class="digit">${h}</div>`;
    minuteEl.innerHTML = `<div class="digit">${String(m).padStart(2,"0")}</div>`;
    ampmEl.textContent = ampm;
    lastH = h;
    lastM = m;
  } else {
    if (h !== lastH) {
      updateDigit(hourEl, h);
      ampmEl.textContent = ampm;
      lastH = h;
    }
    if (m !== lastM) {
      updateDigit(minuteEl, String(m).padStart(2,"0"));
      lastM = m;
    }
  }

  secEl.textContent = String(s).padStart(2,"0");
  setTimeout(tick, 1000 - new Date().getMilliseconds());
}

function smoothSeconds() {
  const d = new Date();
  const p = d.getMilliseconds() / 1000;
  secEl.style.opacity = 0.22 + p * 0.16;
  requestAnimationFrame(smoothSeconds);
}

tick();
smoothSeconds();
</script>

</body>
</html>
