<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Aesthetic Clock</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
/* =========================
   DESIGN TOKENS
========================= */
:root {
  --bg-outer: #0a0a0a;
  --bg-inner: #000000;

  --card-top: #141414;
  --card-bottom: #080808;

  --digit-color: #f2f2f2;
  --accent-color: rgba(255,255,255,0.28);

  --card-radius: 28px;

  /* BASE SIZE */
  --card-size: 280px;

  /* DIGITS */
  --digit-size: 10.6rem;
  --accent-size: 0.95rem;

  --ease: cubic-bezier(.22,.61,.36,1);
  --anim-duration: 480ms;
}

/* =========================
   BASE
========================= */
* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: radial-gradient(circle at center, var(--bg-outer), var(--bg-inner));
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

/* =========================
   CLOCK SCALE (IMPORTANT)
========================= */
.clock-scale {
  /* THIS is what makes it bigger on screen */
  transform: scale(1.25);
  transform-origin: center;
}

/* =========================
   LAYOUT
========================= */
.clock {
  display: flex;
  gap: 12px;
}

.card {
  position: relative;
  width: var(--card-size);
  height: var(--card-size);
  background: linear-gradient(to bottom, var(--card-top), var(--card-bottom));
  border-radius: var(--card-radius);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.025),
    0 55px 110px rgba(0,0,0,0.85);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

/* subtle seam */
.card::after {
  content: "";
  position: absolute;
  left: 12%;
  right: 12%;
  top: 50%;
  height: 1px;
  background: rgba(255,255,255,0.04);
}

/* =========================
   DIGITS
========================= */
.digit-wrapper {
  position: relative;
  width: 100%;
  height: 100%;
}

.digit {
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: var(--digit-size);
  font-weight: 700;
  color: var(--digit-color);
  line-height: 1;
  transform: translateY(-2px);
  transition:
    transform var(--anim-duration) var(--ease),
    opacity var(--anim-duration) var(--ease);
}

.digit.enter {
  transform: translateY(100%);
  opacity: 0;
}

.digit.exit {
  transform: translateY(-100%);
  opacity: 0;
}

/* =========================
   ACCENTS
========================= */
.ampm {
  position: absolute;
  top: 18px;
  left: 22px;
  font-size: var(--accent-size);
  letter-spacing: 0.12em;
  font-weight: 600;
  color: var(--accent-color);
}

.seconds {
  position: absolute;
  bottom: 18px;
  right: 22px;
  font-size: var(--accent-size);
  letter-spacing: 0.12em;
  font-weight: 600;
  color: var(--accent-color);
  transition:
    opacity 260ms var(--ease),
    transform 260ms var(--ease);
}
</style>
</head>

<body>

<div class="clock-scale">
  <div class="clock">

    <!-- HOURS -->
    <div class="card">
      <div class="ampm" id="ampm">AM</div>
      <div class="digit-wrapper" id="hour"></div>
    </div>

    <!-- MINUTES -->
    <div class="card">
      <div class="seconds" id="seconds">00</div>
      <div class="digit-wrapper" id="minute"></div>
    </div>

  </div>
</div>

<script>
function getTimeParts() {
  const now = new Date();
  let h = now.getHours();
  const m = now.getMinutes();
  const s = now.getSeconds();

  const ampm = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;

  return { h, m, s, ampm };
}

function updateDigit(container, value) {
  const current = container.querySelector(".digit");
  if (current && current.textContent === value) return;

  const next = document.createElement("div");
  next.className = "digit enter";
  next.textContent = value;
  container.appendChild(next);

  requestAnimationFrame(() => {
    next.classList.remove("enter");
    if (current) current.classList.add("exit");
  });

  if (current) setTimeout(() => current.remove(), 600);
}

const hourEl = document.getElementById("hour");
const minuteEl = document.getElementById("minute");
const ampmEl = document.getElementById("ampm");
const secEl = document.getElementById("seconds");

let lastH = null;
let lastM = null;

function tick() {
  const { h, m, s, ampm } = getTimeParts();

  if (lastH === null) {
    const hd = document.createElement("div");
    hd.className = "digit";
    hd.textContent = h;
    hourEl.appendChild(hd);

    const md = document.createElement("div");
    md.className = "digit";
    md.textContent = String(m).padStart(2, "0");
    minuteEl.appendChild(md);

    ampmEl.textContent = ampm;
    lastH = h;
    lastM = m;
  } else {
    if (h !== lastH) {
      updateDigit(hourEl, h);
      ampmEl.textContent = ampm;
      lastH = h;
    }
    if (m !== lastM) {
      updateDigit(minuteEl, String(m).padStart(2, "0"));
      lastM = m;
    }
  }

  secEl.textContent = String(s).padStart(2, "0");
  secEl.style.opacity = "0.55";
  secEl.style.transform = "translateY(-1px)";
  setTimeout(() => {
    secEl.style.opacity = "0.28";
    secEl.style.transform = "translateY(0)";
  }, 120);

  setTimeout(tick, 1000);
}

tick();
</script>

</body>
</html>
