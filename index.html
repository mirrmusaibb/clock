<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Refined Clock</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --bg: #000;
  --digit: #f2f2f2;
  --accent: rgba(255,255,255,0.3);

  --size: 260px;
  --radius: 28px;
  --digit-size: 9.8rem;
  --fade: 180ms;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: radial-gradient(circle, #111, #000);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: system-ui, sans-serif;
}

.clock {
  display: flex;
  gap: 12px;
}

.card {
  width: var(--size);
  height: var(--size);
  background: linear-gradient(#141414, #0a0a0a);
  border-radius: var(--radius);
  box-shadow: 0 40px 80px rgba(0,0,0,.9);
  position: relative;
  overflow: hidden;
}

/* seam */
.card::after {
  content: "";
  position: absolute;
  left: 12%;
  right: 12%;
  top: 50%;
  height: 1px;
  background: rgba(255,255,255,.05);
}

/* ================= DIGIT ================= */

.display {
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: .15em;
}

.digit {
  position: relative;
  width: .65em;
  height: 1.2em;
}

.half {
  position: absolute;
  width: 100%;
  height: 50%;
  overflow: hidden;
  display: flex;
  justify-content: center;
  font-size: var(--digit-size);
  font-weight: 700;
  color: var(--digit);
}

.half.top { top: 0; }
.half.bottom { bottom: 0; }

.half span {
  display: inline-block;
  transition: opacity var(--fade) ease-out;
}

.half.top span { transform: translateY(50%); }
.half.bottom span { transform: translateY(-50%); }

/* ================= ACCENTS ================= */

.ampm {
  position: absolute;
  top: 14px;
  left: 18px;
  font-size: .85rem;
  letter-spacing: .12em;
  color: var(--accent);
}

.seconds {
  position: absolute;
  bottom: 14px;
  right: 18px;
  font-size: .85rem;
  letter-spacing: .12em;
  color: var(--accent);
}
</style>
</head>

<body>

<div class="clock">
  <div class="card">
    <div class="ampm" id="ampm">AM</div>
    <div class="display" id="hour"></div>
  </div>

  <div class="card">
    <div class="seconds" id="sec">00</div>
    <div class="display" id="minute"></div>
  </div>
</div>

<script>
function createDigit(char) {
  const d = document.createElement("div");
  d.className = "digit";
  d.innerHTML = `
    <div class="half top"><span>${char}</span></div>
    <div class="half bottom"><span>${char}</span></div>
  `;
  return d;
}

function updateDigit(digitEl, char) {
  const spans = digitEl.querySelectorAll("span");
  if (spans[0].textContent === char) return;

  spans.forEach(s => {
    s.style.opacity = "0";
  });

  setTimeout(() => {
    spans.forEach(s => {
      s.textContent = char;
      s.style.opacity = "1";
    });
  }, 80);
}

function setDisplay(container, value) {
  const chars = String(value).split("");

  if (container.children.length === 0) {
    chars.forEach(c => container.appendChild(createDigit(c)));
    return;
  }

  chars.forEach((c, i) => {
    updateDigit(container.children[i], c);
  });
}

function getTime() {
  const d = new Date();
  let h = d.getHours();
  const m = d.getMinutes();
  const s = d.getSeconds();
  const ampm = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;
  return { h, m, s, ampm };
}

const hourEl = document.getElementById("hour");
const minEl = document.getElementById("minute");
const secEl = document.getElementById("sec");
const ampmEl = document.getElementById("ampm");

function tick() {
  const { h, m, s, ampm } = getTime();

  setDisplay(hourEl, h);
  setDisplay(minEl, String(m).padStart(2, "0"));

  secEl.textContent = String(s).padStart(2, "0");
  ampmEl.textContent = ampm;

  const now = Date.now();
  const delay = 1000 - (now % 1000);
  setTimeout(tick, delay);
}

tick();
</script>

</body>
</html>
