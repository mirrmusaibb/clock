<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Clock</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
/* =========================
   DESIGN TOKENS
========================= */
:root {
  --bg-outer: #090909;
  --bg-inner: #000000;

  --card-top: #101010;
  --card-bottom: #070707;

  --digit-color: #f1f1f1;
  --accent-color: rgba(255,255,255,0.26);

  --card-radius: 26px;
  --card-size: 260px;

  --digit-size: 9.6rem;
  --accent-size: 0.9rem;

  --anim-duration: 170ms;
  --ease: cubic-bezier(.2,.6,.4,1);
}

/* =========================
   BASE
========================= */
* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: radial-gradient(circle at center, var(--bg-outer), var(--bg-inner));
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

/* =========================
   CLOCK SCALE
========================= */
.clock-scale {
  transform: scale(1.15);
  transform-origin: center;
}

/* =========================
   LAYOUT
========================= */
.clock {
  display: flex;
  gap: 8px;
}

.card {
  position: relative;
  width: var(--card-size);
  height: var(--card-size);
  background: linear-gradient(to bottom, var(--card-top), var(--card-bottom));
  border-radius: var(--card-radius);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.018),
    0 42px 90px rgba(0,0,0,0.9);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

/* subtle seam */
.card::after {
  content: "";
  position: absolute;
  left: 14%;
  right: 14%;
  top: 50%;
  height: 1px;
  background: rgba(255,255,255,0.03);
}

/* =========================
   DIGITS (SYSTEM STYLE)
========================= */
.digit-wrapper {
  position: relative;
  width: 100%;
  height: 100%;
}

.digit {
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: var(--digit-size);
  font-weight: 750;
  color: var(--digit-color);
  line-height: 1;
  opacity: 1;
  transform: scale(1);
  transition:
    opacity var(--anim-duration) var(--ease),
    transform var(--anim-duration) var(--ease);
}

/* old digit */
.digit.exit {
  opacity: 0;
  transform: scale(0.96);
}

/* new digit */
.digit.enter {
  opacity: 0;
  transform: scale(1.04);
}

/* =========================
   ACCENTS
========================= */
.ampm {
  position: absolute;
  top: 16px;
  left: 20px;
  font-size: var(--accent-size);
  letter-spacing: 0.12em;
  font-weight: 600;
  color: var(--accent-color);
}

.seconds {
  position: absolute;
  bottom: 16px;
  right: 20px;
  font-size: var(--accent-size);
  letter-spacing: 0.12em;
  font-weight: 600;
  color: var(--accent-color);
  opacity: 0.26;
  will-change: transform, opacity;
}

/* =========================
   REDUCED MOTION
========================= */
@media (prefers-reduced-motion: reduce) {
  .digit {
    transition: none;
  }
}
</style>
</head>

<body>

<div class="clock-scale">
  <div class="clock">

    <!-- HOURS -->
    <div class="card">
      <div class="ampm" id="ampm">AM</div>
      <div class="digit-wrapper" id="hour"></div>
    </div>

    <!-- MINUTES -->
    <div class="card">
      <div class="seconds" id="seconds">00</div>
      <div class="digit-wrapper" id="minute"></div>
    </div>

  </div>
</div>

<script>
/* =========================
   TIME HELPERS
========================= */
function getTimeParts() {
  const now = new Date();
  let h = now.getHours();
  const m = now.getMinutes();
  const s = now.getSeconds();

  const ampm = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;

  return { h, m, s, ampm };
}

/* =========================
   DIGIT UPDATE (FAST SYSTEM STYLE)
========================= */
function updateDigit(container, value) {
  const current = container.querySelector(".digit");
  if (current && current.textContent === value) return;

  const next = document.createElement("div");
  next.className = "digit enter";
  next.textContent = value;
  container.appendChild(next);

  requestAnimationFrame(() => {
    next.classList.remove("enter");
    if (current) current.classList.add("exit");
  });

  if (current) {
    setTimeout(() => current.remove(), 220);
  }
}

/* =========================
   ELEMENTS
========================= */
const hourEl = document.getElementById("hour");
const minuteEl = document.getElementById("minute");
const ampmEl = document.getElementById("ampm");
const secEl = document.getElementById("seconds");

let lastH = null;
let lastM = null;

/* =========================
   MAIN TICK (HOURS + MINUTES)
========================= */
function tick() {
  const { h, m, ampm } = getTimeParts();

  if (lastH === null) {
    const hd = document.createElement("div");
    hd.className = "digit";
    hd.textContent = h;
    hourEl.appendChild(hd);

    const md = document.createElement("div");
    md.className = "digit";
    md.textContent = String(m).padStart(2, "0");
    minuteEl.appendChild(md);

    ampmEl.textContent = ampm;
    lastH = h;
    lastM = m;
  } else {
    if (h !== lastH) {
      updateDigit(hourEl, h);
      ampmEl.textContent = ampm;
      lastH = h;
    }
    if (m !== lastM) {
      updateDigit(minuteEl, String(m).padStart(2, "0"));
      lastM = m;
    }
  }

  setTimeout(tick, 1000 - new Date().getMilliseconds());
}

/* =========================
   SMOOTH SECONDS (RAF)
========================= */
function smoothSeconds() {
  const now = new Date();
  const s = now.getSeconds();
  const ms = now.getMilliseconds();
  const p = ms / 1000;

  secEl.textContent = String(s).padStart(2, "0");
  secEl.style.opacity = 0.26 + p * 0.18;
  secEl.style.transform = `translateY(${-p}px)`;

  requestAnimationFrame(smoothSeconds);
}

/* =========================
   START
========================= */
tick();
smoothSeconds();
</script>

</body>
</html>
