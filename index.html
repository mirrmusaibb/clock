<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>True Flip Clock</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --bg-outer: #0a0a0a;
  --bg-inner: #000;

  --card-top: #141414;
  --card-bottom: #080808;

  --digit: #f2f2f2;
  --accent: rgba(255,255,255,0.28);

  --card-size: 260px;
  --radius: 28px;

  --digit-size: 10rem;
  --accent-size: 0.9rem;

  --flip-duration: 700ms;
  --ease-in: cubic-bezier(.55,.06,.68,.19);
  --ease-out: cubic-bezier(.22,.61,.36,1);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: radial-gradient(circle at center, var(--bg-outer), var(--bg-inner));
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.clock-scale {
  transform: scale(1.15);
}

.clock {
  display: flex;
  gap: 10px;
}

.card {
  position: relative;
  width: var(--card-size);
  height: var(--card-size);
  background: linear-gradient(to bottom, var(--card-top), var(--card-bottom));
  border-radius: var(--radius);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.02),
    0 45px 90px rgba(0,0,0,0.85);
  perspective: 1200px;
  overflow: hidden;
}

/* seam */
.card::after {
  content: "";
  position: absolute;
  left: 12%;
  right: 12%;
  top: 50%;
  height: 1px;
  background: rgba(255,255,255,0.04);
  z-index: 5;
}

/* =====================
   FLIP STRUCTURE
===================== */
.flip {
  position: absolute;
  inset: 0;
}

.panel {
  position: absolute;
  left: 0;
  width: 100%;
  height: 50%;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: var(--digit-size);
  font-weight: 700;
  color: var(--digit);
  backface-visibility: hidden;
}

.panel span {
  transform: translateY(50%);
}

.bottom span {
  transform: translateY(-50%);
}

.top {
  top: 0;
  transform-origin: bottom;
}

.bottom {
  bottom: 0;
  transform-origin: top;
}

/* =====================
   FLIP ANIMATION
===================== */
.flip.animate .top.old {
  animation: topFlip var(--flip-duration) var(--ease-in) forwards;
}

.flip.animate .bottom.new {
  animation: bottomFlip var(--flip-duration) var(--ease-out) forwards;
}

@keyframes topFlip {
  0%   { transform: rotateX(0deg); }
  100% { transform: rotateX(-90deg); }
}

@keyframes bottomFlip {
  0%   { transform: rotateX(90deg); }
  100% { transform: rotateX(0deg); }
}

/* =====================
   ACCENTS
===================== */
.ampm {
  position: absolute;
  top: 16px;
  left: 20px;
  font-size: var(--accent-size);
  letter-spacing: 0.12em;
  font-weight: 600;
  color: var(--accent);
  z-index: 10;
}

.seconds {
  position: absolute;
  bottom: 16px;
  right: 20px;
  font-size: var(--accent-size);
  letter-spacing: 0.12em;
  font-weight: 600;
  color: var(--accent);
  z-index: 10;
}
</style>
</head>

<body>

<div class="clock-scale">
  <div class="clock">

    <div class="card">
      <div class="ampm" id="ampm">AM</div>
      <div class="flip" id="hour"></div>
    </div>

    <div class="card">
      <div class="seconds" id="seconds">00</div>
      <div class="flip" id="minute"></div>
    </div>

  </div>
</div>

<script>
function buildFlip(container, value) {
  container.innerHTML = `
    <div class="panel top old"><span>${value}</span></div>
    <div class="panel bottom old"><span>${value}</span></div>
    <div class="panel top new"><span>${value}</span></div>
    <div class="panel bottom new"><span>${value}</span></div>
  `;
}

function flipTo(container, value) {
  const oldTop = container.querySelector('.top.old span');
  const oldBottom = container.querySelector('.bottom.old span');
  const newTop = container.querySelector('.top.new span');
  const newBottom = container.querySelector('.bottom.new span');

  if (oldTop.textContent === value) return;

  newTop.textContent = value;
  newBottom.textContent = value;

  container.classList.remove('animate');
  void container.offsetWidth;
  container.classList.add('animate');

  setTimeout(() => {
    oldTop.textContent = value;
    oldBottom.textContent = value;
    container.classList.remove('animate');
  }, 750);
}

function getTime() {
  const now = new Date();
  let h = now.getHours();
  const m = now.getMinutes();
  const s = now.getSeconds();
  const ampm = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;
  return { h, m, s, ampm };
}

const hourEl = document.getElementById('hour');
const minEl = document.getElementById('minute');
const ampmEl = document.getElementById('ampm');
const secEl = document.getElementById('seconds');

let lastH = null;
let lastM = null;

function tick() {
  const { h, m, s, ampm } = getTime();

  if (lastH === null) {
    buildFlip(hourEl, h);
    buildFlip(minEl, String(m).padStart(2, '0'));
    lastH = h;
    lastM = m;
    ampmEl.textContent = ampm;
  } else {
    if (h !== lastH) {
      flipTo(hourEl, h);
      ampmEl.textContent = ampm;
      lastH = h;
    }
    if (m !== lastM) {
      flipTo(minEl, String(m).padStart(2, '0'));
      lastM = m;
    }
  }

  secEl.textContent = String(s).padStart(2, '0');
  setTimeout(tick, 1000);
}

tick();
</script>

</body>
</html>
