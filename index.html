<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta charset="UTF-8" />
<title>Aesthetic OLED Clock</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
/* =========================
   DESIGN TOKENS (OLED)
========================= */
:root {
  --bg-outer: #000000;
  --bg-inner: #000000;

  --card-top: #0b0b0b;
  --card-bottom: #060606;

  --digit-color: #f5f5f5;
  --accent-color: rgba(255,255,255,0.22);

  --card-radius: 22px;

  /* Responsive size */
  --card-size: clamp(180px, 38vw, 260px);

  /* Digits */
  --digit-size: clamp(6.5rem, 14vw, 9.4rem);
  --accent-size: clamp(0.75rem, 2.2vw, 0.9rem);

  /* Ultra-fast */
  --anim-duration: 110ms;
  --ease: linear;
}

/* =========================
   BASE
========================= */
* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg-inner);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* =========================
   LAYOUT
========================= */
.clock {
  display: flex;
  gap: clamp(6px, 2vw, 8px);
  padding: env(safe-area-inset-top)
           env(safe-area-inset-right)
           env(safe-area-inset-bottom)
           env(safe-area-inset-left);
}

.card {
  position: relative;
  width: var(--card-size);
  height: var(--card-size);
  background: linear-gradient(to bottom, var(--card-top), var(--card-bottom));
  border-radius: var(--card-radius);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.015),
    0 28px 70px rgba(0,0,0,0.9);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

/* seam (very subtle) */
.card::after {
  content: "";
  position: absolute;
  left: 18%;
  right: 18%;
  top: 50%;
  height: 1px;
  background: rgba(255,255,255,0.025);
}

/* =========================
   DIGITS (INSTANT SYSTEM STYLE)
========================= */
.digit-wrapper {
  position: relative;
  width: 100%;
  height: 100%;
}

.digit {
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: var(--digit-size);
  font-weight: 700;
  color: var(--digit-color);
  line-height: 1;
  opacity: 1;
  transition: opacity var(--anim-duration) var(--ease);
}

.digit.exit {
  opacity: 0;
}

.digit.enter {
  opacity: 0;
}

/* =========================
   ACCENTS
========================= */
.ampm {
  position: absolute;
  top: clamp(10px, 3vw, 16px);
  left: clamp(12px, 3vw, 20px);
  font-size: var(--accent-size);
  letter-spacing: 0.12em;
  font-weight: 600;
  color: var(--accent-color);
}

.seconds {
  position: absolute;
  bottom: clamp(10px, 3vw, 16px);
  right: clamp(12px, 3vw, 20px);
  font-size: var(--accent-size);
  letter-spacing: 0.12em;
  font-weight: 600;
  color: var(--accent-color);
  opacity: 0.24;
  will-change: opacity;
}

/* =========================
   REDUCED MOTION
========================= */
@media (prefers-reduced-motion: reduce) {
  .digit {
    transition: none;
  }
}
</style>
</head>

<body>

<div class="clock">

  <!-- HOURS -->
  <div class="card">
    <div class="ampm" id="ampm">AM</div>
    <div class="digit-wrapper" id="hour"></div>
  </div>

  <!-- MINUTES -->
  <div class="card">
    <div class="seconds" id="seconds">00</div>
    <div class="digit-wrapper" id="minute"></div>
  </div>

</div>

<script>
/* =========================
   TIME HELPERS
========================= */
function getTimeParts() {
  const now = new Date();
  let h = now.getHours();
  const m = now.getMinutes();
  const s = now.getSeconds();

  const ampm = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;

  return { h, m, s, ampm };
}

/* =========================
   DIGIT UPDATE (INSTANT)
========================= */
function updateDigit(container, value) {
  const current = container.querySelector(".digit");
  if (current && current.textContent === value) return;

  const next = document.createElement("div");
  next.className = "digit enter";
  next.textContent = value;
  container.appendChild(next);

  requestAnimationFrame(() => {
    next.classList.remove("enter");
    if (current) current.classList.add("exit");
  });

  if (current) {
    setTimeout(() => current.remove(), 140);
  }
}

/* =========================
   ELEMENTS
========================= */
const hourEl = document.getElementById("hour");
const minuteEl = document.getElementById("minute");
const ampmEl = document.getElementById("ampm");
const secEl = document.getElementById("seconds");

let lastH = null;
let lastM = null;

/* =========================
   HOURS + MINUTES
========================= */
function tick() {
  const { h, m, ampm } = getTimeParts();

  if (lastH === null) {
    hourEl.innerHTML = `<div class="digit">${h}</div>`;
    minuteEl.innerHTML = `<div class="digit">${String(m).padStart(2,"0")}</div>`;
    ampmEl.textContent = ampm;
    lastH = h;
    lastM = m;
  } else {
    if (h !== lastH) {
      updateDigit(hourEl, h);
      ampmEl.textContent = ampm;
      lastH = h;
    }
    if (m !== lastM) {
      updateDigit(minuteEl, String(m).padStart(2,"0"));
      lastM = m;
    }
  }

  setTimeout(tick, 1000 - new Date().getMilliseconds());
}

/* =========================
   SMOOTH SECONDS (OLED CALM)
========================= */
function smoothSeconds() {
  const now = new Date();
  const s = now.getSeconds();
  const ms = now.getMilliseconds();
  const p = ms / 1000;

  secEl.textContent = String(s).padStart(2,"0");
  secEl.style.opacity = 0.22 + p * 0.16;

  requestAnimationFrame(smoothSeconds);
}

/* =========================
   START
========================= */
tick();
smoothSeconds();
</script>

</body>
</html>
